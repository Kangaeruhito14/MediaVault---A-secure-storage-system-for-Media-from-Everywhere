<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · MediaVault</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #fafafa;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .box { max-width: 380px; }
    .logo {
      width: 56px; height: 56px; border-radius: 14px; background: #fafafa; color: #0a0a0a;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.6; color: #a1a1aa; margin: 0 0 24px; }
    button {
      background: #fafafa; color: #0a0a0a; border: none; border-radius: 100px;
      padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none">
        <rect x="7" y="13" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M10 13V10a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="14" cy="18" r="1.5" fill="currentColor"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>MediaVault can't reach your server right now. Your encrypted files are safe — reconnect to your network or VPN and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
